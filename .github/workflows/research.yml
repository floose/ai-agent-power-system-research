name: Power Systems AI Research
on:
  pull_request:
  push:
    branches: ['main', 'feat/**']
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * 1'
      timezone: Europe/Madrid
permissions:
  contents: read
concurrency:
  group: research-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q scripts tests
  report:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate candidates and open PR
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          week=$(TZ=Europe/Madrid date +%G-W%V)
          today=$(TZ=Europe/Madrid date +%F)
          branch="research/$week"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            echo "Weekly branch already exists; review its PR before another run."
            exit 1
          fi
          git switch -c "$branch"
          python -m unittest discover -s tests -v
          python scripts/research.py --until "$today"
          git add reports data/seen_dois.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "research: DOI-validated candidates for $week"
          git push origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "Research candidates: $week" \
            --body 'DOI-validated Crossref candidates with provenance and state. Methods, results, relevance and peer review require expert verification. Review report and state together; no auto-merge.'
